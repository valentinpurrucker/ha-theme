title: Still Home
views:
  - title: Home
    path: home
    type: sections
    max_columns: 3
    theme: Still
    sections:
      - type: grid
        cards:
          - type: custom:still-title-card
            name: At home
            subtitle: A little space to breathe.
          - type: custom:still-chips-card
            chips:
              - entity: person.alex
                icon: mdi:home-outline
              - entity: sensor.indoor_temperature
                name: Inside
                icon: mdi:thermometer
          - type: custom:still-weather-card
            entity: weather.home
            name: Outside
          - type: custom:still-solar-card
            entity: sensor.solar_power
            name: Solar & energy
            solar:
              home_power: sensor.home_power
              grid_power: sensor.grid_power
              battery_level: sensor.battery_level
              battery_power: sensor.battery_power
              energy_today: sensor.solar_today
      - type: grid
        cards:
          - type: custom:still-title-card
            name: Living room
          - type: custom:still-light-card
            entity: light.living_room
            name: Reading light
          - type: custom:still-climate-card
            entity: climate.living_room
            show_presets: true
          - type: custom:still-media-card
            entity: media_player.living_room
          - type: custom:still-cover-card
            entity: cover.living_room
      - type: grid
        cards:
          - type: custom:still-title-card
            name: The little things
          - type: custom:still-fan-card
            entity: fan.bedroom
          - type: custom:still-light-card
            entity: light.bedroom
            layout: tile
          - type: custom:still-toggle-card
            entity: switch.coffee_machine
          - type: custom:still-scene-card
            entity: scene.slow_evening
            name: Slow evening
          - type: custom:still-scene-card
            entity: scene.goodnight
            name: Good night
            icon: mdi:weather-night
            style:
              accent: "#8b789d"
