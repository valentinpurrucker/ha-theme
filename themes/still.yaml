Still:
  # Shared tokens. HA theme keys become CSS properties prefixed with --.
  primary-color: "#0066d6"
  accent-color: "#0066d6"
  still-accent: "var(--primary-color)"
  still-on-accent: "#ffffff"
  still-font: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  still-radius: "24px"
  still-padding: "20px"
  still-icon-size: "44px"
  still-icon-radius: "14px"
  still-control-radius: "13px"
  still-chip-radius: "30px"
  still-dialog-radius: "30px"
  still-toggle-color: "#248b45"
  still-light-color: "#a76500"
  still-solar-color: "#147a53"
  still-shadow: "0 2px 10px #00000003"
  still-border: "1px solid var(--still-border-color)"
  ha-card-border-radius: "24px"
  ha-card-box-shadow: "none"
  ha-card-border-width: "1px"
  state-active-color: "var(--primary-color)"
  state-light-active-color: "#ba8839"
  modes:
    light:
      primary-background-color: "#f2f2f7"
      secondary-background-color: "#e5e5ea"
      card-background-color: "#ffffff"
      ha-card-background: "#ffffff"
      primary-text-color: "#1c1c1e"
      secondary-text-color: "#63636c"
      divider-color: "#e5e5ea"
      app-header-background-color: "#f2f2f7"
      app-header-text-color: "#1c1c1e"
      sidebar-background-color: "#f8f8fc"
      sidebar-text-color: "#63636c"
      sidebar-selected-text-color: "#0066d6"
      sidebar-selected-background-color: "#e7efff"
      still-surface: "#ffffff"
      still-text: "#1c1c1e"
      still-muted: "#63636c"
      still-subtle: "#f2f2f7"
      still-border-color: "#e5e5ea"
      ha-card-border-color: "#e5e5ea"
    dark:
      primary-color: "#80b5ff"
      accent-color: "#80b5ff"
      primary-background-color: "#0b0b10"
      secondary-background-color: "#2c2c2e"
      card-background-color: "#1c1c1e"
      ha-card-background: "#1c1c1e"
      primary-text-color: "#f5f5f7"
      secondary-text-color: "#aaaab2"
      divider-color: "#38383d"
      app-header-background-color: "#0b0b10"
      app-header-text-color: "#f5f5f7"
      sidebar-background-color: "#16161a"
      sidebar-text-color: "#aaaab2"
      sidebar-selected-text-color: "#80b5ff"
      sidebar-selected-background-color: "#23324d"
      still-toggle-color: "#30b759"
      still-light-color: "#ffd074"
      still-solar-color: "#72d6a1"
      still-on-accent: "#101827"
      still-surface: "#1c1c1e"
      still-text: "#f5f5f7"
      still-muted: "#aaaab2"
      still-subtle: "#2c2c2e"
      still-border-color: "#38383d"
      ha-card-border-color: "#38383d"
