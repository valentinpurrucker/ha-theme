Still:
  # Shared tokens. HA theme keys become CSS properties prefixed with --.
  primary-color: "#4c745d"
  accent-color: "#4c745d"
  still-accent: "var(--primary-color)"
  still-on-accent: "#ffffff"
  still-font: "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  still-radius: "22px"
  still-padding: "20px"
  still-icon-size: "44px"
  still-icon-radius: "15px"
  still-control-radius: "13px"
  still-chip-radius: "30px"
  still-shadow: "none"
  still-border: "1px solid var(--still-border-color)"
  ha-card-border-radius: "22px"
  ha-card-box-shadow: "none"
  ha-card-border-width: "1px"
  state-active-color: "var(--primary-color)"
  state-light-active-color: "#ba8839"
  modes:
    light:
      primary-background-color: "#f5f6f2"
      secondary-background-color: "#eceee8"
      card-background-color: "#ffffff"
      ha-card-background: "#ffffff"
      primary-text-color: "#28332e"
      secondary-text-color: "#606a62"
      divider-color: "#e3e8df"
      app-header-background-color: "#f5f6f2"
      app-header-text-color: "#28332e"
      sidebar-background-color: "#fbfcf9"
      sidebar-text-color: "#606a62"
      sidebar-selected-text-color: "#4c745d"
      sidebar-selected-background-color: "#e9efe7"
      still-surface: "#ffffff"
      still-text: "#28332e"
      still-muted: "#606a62"
      still-subtle: "#f1f4ee"
      still-border-color: "#e3e8df"
      ha-card-border-color: "#e3e8df"
    dark:
      primary-color: "#a8c5ae"
      accent-color: "#a8c5ae"
      primary-background-color: "#191f1c"
      secondary-background-color: "#252d27"
      card-background-color: "#242c26"
      ha-card-background: "#242c26"
      primary-text-color: "#e6ece3"
      secondary-text-color: "#a5afa5"
      divider-color: "#354036"
      app-header-background-color: "#191f1c"
      app-header-text-color: "#e6ece3"
      sidebar-background-color: "#1d251f"
      sidebar-text-color: "#a5afa5"
      sidebar-selected-text-color: "#a8c5ae"
      sidebar-selected-background-color: "#2b392f"
      still-on-accent: "#1c2b20"
      still-surface: "#242c26"
      still-text: "#e6ece3"
      still-muted: "#a5afa5"
      still-subtle: "#2c352e"
      still-border-color: "#354036"
      ha-card-border-color: "#354036"
